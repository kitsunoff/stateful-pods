# A machine seeded from an Alpine image: no bash, no GNU tar, nothing the chart
# could have executed inside it. The reference is set by the test, which pushes
# the image to the registry running in the cluster.
#
# Provisioned natively, because this image has no cloud-init and never will -
# which is the whole reason it is here. It is also what a machine on any image
# without cloud-init has to say, and the suite proves the refusal separately by
# installing the same image with no backend declared at all.
machines:
  tiny:
    guest:
      provisioning: native
    source:
      kind: oci
      reference: replaced-by-the-test
    security:
      mode: privileged
    rootfs:
      size: 1Gi
