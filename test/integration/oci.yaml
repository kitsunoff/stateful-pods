# A machine seeded from the integration test's own source image.
# privileged mode, because a kind node is itself a container and user namespaces
# nested inside one are unreliable - see docs/research/05-open-questions.md §12.
machines:
  web:
    source:
      kind: oci
      reference: stateful-pods-test-source:integration
    security:
      mode: privileged
    rootfs:
      size: 2Gi
    # Declared ports, and the posture that asks for only those to be admitted.
    # kind runs kindnet, which implements no NetworkPolicy at all, so what the
    # suite can prove here is the shape of what was rendered and that a machine
    # asking for the posture still boots and still becomes ready. Enforcement
    # belongs to the cluster's network plugin and is deliberately not claimed.
    network:
      ingress: declared
      ports:
        ssh:
          port: 22
        dns-tcp:
          port: 53
          protocol: TCP
        dns-udp:
          port: 53
          protocol: UDP
    # One volume beside the root filesystem. Small, because what is being
    # asserted is that the path inside the machine really is this claim and not
    # a directory on the root filesystem that looks like one - which is exactly
    # what a mount that silently did not happen leaves behind.
    volumes:
      data:
        mountPath: /var/lib/data
        size: 1Gi
