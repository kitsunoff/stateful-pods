# Publishes preset images.
#
# Dispatched by hand, and called by the daily bump. Nothing here runs on a push:
# a preset's content comes from linuxcontainers.org and has nothing to do with a
# commit, so building one on every push would republish identical bytes under a
# tag that already exists and do nothing else.
#
# Publishing without review is safe in a way that changing the catalog is not. A
# dated tag is immutable and new, so nothing already published is rewritten, and
# nothing uses it until the catalog says so - which is a reviewed pull request.
#
# The release's rolling tag does move, and moving it is the point of it. It is a
# name for a person who wants the newest build without looking one up; nothing
# resolves it, because the catalog pins digests and the check on that catalog
# fails the build if an entry is ever a tag. So what a machine is seeded from is
# still decided in a reviewed pull request, and this run cannot change it.
name: preset-publish

on:
  workflow_dispatch:
    inputs:
      presets:
        description: >-
          Presets to publish, space separated. Empty publishes every preset in
          images/presets/presets.list.
        required: false
        default: ''
  workflow_call:
    inputs:
      presets:
        type: string
        required: true
    outputs:
      published:
        description: One line per preset - name, upstream build, digest-pinned reference.
        value: ${{ jobs.publish.outputs.published }}

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.build.outputs.published }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # No QEMU and no Buildx. A preset's layer is the upstream archive itself,
      # so there is nothing to build and nothing for emulation to run: packaging
      # a foreign architecture's root filesystem never executes it.
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      # Through the environment rather than interpolated into the script body,
      # which is the standard hardening for anything carrying a secret.
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | crane auth login ghcr.io --username "$REGISTRY_USER" --password-stdin

      # Before anything is fetched. A build that cannot establish what it is
      # packaging must not package anything, and this is the cheapest place to
      # find out that it cannot.
      - name: Confirm the pinned signing key
        run: ./hack/preset-build.sh --check-key

      - name: Verify and publish
        id: build
        env:
          PRESETS: ${{ inputs.presets }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -o nounset -o pipefail
          # Unquoted on purpose: this is a list of preset names, and an empty
          # value has to become no arguments rather than one empty argument.
          # shellcheck disable=SC2086
          ./hack/preset-build.sh \
            --repository "ghcr.io/$REPOSITORY_OWNER/stateful-pods-" \
            $PRESETS > published.tsv
          status=$?
          cat published.tsv
          # 3 is "the upstream has not finished this build for every
          # architecture yet", which the daily bump already treats as a wait
          # rather than news - and an upstream can start rebuilding in the hour
          # between that survey and this. Failing here would throw away the
          # presets that did publish and skip the proposal for all of them. Any
          # other non-zero status is something being wrong.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          if [ ! -s published.tsv ]; then
            echo "nothing was published" >&2
            exit "$status"
          fi
          {
            echo 'published<<PUBLISHED_EOF'
            cat published.tsv
            echo 'PUBLISHED_EOF'
          } >> "$GITHUB_OUTPUT"

      # A reference that resolves is the whole deliverable, and it is worth one
      # line to find out here rather than from a machine that will not start.
      - name: Confirm every published reference resolves
        run: |
          set -o errexit -o nounset -o pipefail
          while IFS=$'\t' read -r preset build reference; do
            [ -n "$reference" ] || continue
            for platform in linux/amd64 linux/arm64; do
              crane manifest --platform "$platform" "$reference" > /dev/null
              echo "ok - $preset ($build) resolves for $platform"
            done
          done < published.tsv

      # The rolling tag is the name people are told to pull, and it is the one
      # reference here that moved rather than appeared. A tag that did not follow
      # would leave somebody pulling last week's root filesystem while every log
      # line above said the build succeeded, so it is compared against the digest
      # that was just published rather than assumed.
      - name: Confirm each rolling tag followed
        run: |
          set -o errexit -o nounset -o pipefail
          while IFS=$'\t' read -r preset _ reference; do
            [ -n "$reference" ] || continue
            release=""
            while IFS=';' read -r name _ candidate _ _; do
              [ "$name" = "$preset" ] && release="$candidate"
            done < images/presets/presets.list
            if [ -z "$release" ]; then
              echo "$preset has no line in images/presets/presets.list" >&2
              exit 1
            fi
            repository="${reference%@*}"
            rolling="$(crane digest "$repository:$release")"
            if [ "$rolling" != "${reference##*@}" ]; then
              echo "$repository:$release is $rolling, not the ${reference##*@} just published" >&2
              exit 1
            fi
            for platform in linux/amd64 linux/arm64; do
              crane manifest --platform "$platform" "$repository:$release" > /dev/null
              echo "ok - $repository:$release resolves for $platform"
            done
          done < published.tsv

      # GHCR makes a new package private, and the failure that produces looks
      # exactly like a typo in the reference. There is no API for changing it, so
      # this reports rather than fixes - loudly enough that the first publication
      # of a preset does not end with a package nobody outside can pull.
      - name: Report each package's visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -o errexit -o nounset -o pipefail
          # The package is read off the reference that was published rather than
          # composed from the preset's name. A preset publishes into a package
          # named for its distribution, so the two are different strings, and two
          # presets of one distribution would name the same package - which is
          # why this reports each one once.
          while IFS=$'\t' read -r _ _ reference; do
            [ -n "$reference" ] || continue
            repository="${reference%@*}"
            printf '%s\n' "${repository##*/}"
          done < published.tsv | sort --unique > packages.txt
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            visibility="$(gh api "/users/$REPOSITORY_OWNER/packages/container/$package" \
              --jq '.visibility' 2>/dev/null || echo unknown)"
            echo "$package: $visibility"
            if [ "$visibility" = "private" ]; then
              {
                echo "### \`$package\` is private"
                echo
                echo "A preset nobody can pull is a preset that does not work, and the"
                echo "failure looks like a typo in the reference. Package visibility has"
                echo "no REST API; change it under the package's settings, or leave it"
                echo "private and give machines a \`pullSecretName\`."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done < packages.txt
