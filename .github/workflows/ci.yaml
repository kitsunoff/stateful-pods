name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.19.1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stateful-pods-shim
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
  HELM_UNITTEST_VERSION: v1.0.3
  KUBECONFORM_VERSION: v0.7.0

jobs:
  chart:
    name: chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version ${{ env.HELM_UNITTEST_VERSION }}

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --assume-yes shellcheck

      - name: Install kubeconform
        run: |
          curl --silent --show-error --location --fail \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar --extract --gzip --directory /usr/local/bin kubeconform

      - name: Lint the shell scripts
        run: make shell-lint

      - name: Lint the chart
        run: make lint

      - name: Check the documentation guarantees values.yaml makes
        run: make docs

      - name: Run the chart unit tests
        run: make test

      - name: Run the shell script tests
        run: make shell-test

      # The catalog is written by a bot, which is why it is checked - and the
      # check is what enforces that an entry is a digest rather than a tag. The
      # bump workflow runs it on its own commit, but that is the bot checking its
      # own work; a human-authored catalog edit reaches here and nowhere else.
      - name: Check the catalog against what the project builds
        run: make presets

      # Every refusal that makes a preset worth more than an `lxc` source with a
      # checksum somebody found: a signature that does not verify, one stripped
      # out, one never served, an archive that does not match, a signing key that
      # is not the pinned one. Tests nobody runs are not tests.
      - name: Run the preset tests
        run: make preset-test

      - name: Validate every example against the Kubernetes API schemas
        run: make conform

      # Packaged on every run, published only on a tag. `kubectl machine create`
      # installs the chart by reference, and a user who got the plugin from krew
      # has no checkout for that reference to point at - so the chart has to be
      # somewhere. Packaging always is what stops a tag build being the first
      # time anyone finds out it does not package.
      - name: Package the chart
        run: |
          helm package charts/stateful-pods --destination dist
          ls -l dist

      # The plugin defaults the chart version to its own, so a chart published
      # under a tag that disagrees with the version in Chart.yaml would be
      # unreachable by the plugin that shipped with it.
      - name: Check the tag against the chart's own version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart="$(sed -n 's/^version: //p' charts/stateful-pods/Chart.yaml)"
          if [ "$tag" != "$chart" ]; then
            echo "the tag says $tag and Chart.yaml says $chart" >&2
            exit 1
          fi

      - name: Log in to the registry
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the chart
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          helm push "dist/stateful-pods-${GITHUB_REF_NAME#v}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # The plugin targets the bash macOS ships, which is 3.2 and will not change.
  # Every construct that breaks that target - mapfile, an associative array,
  # ${var^^} - runs perfectly in the Linux container the rest of the suites use
  # and fails on somebody's Mac. This job is the whole enforcement of that; a
  # comment in the file would not be.
  plugin:
    name: plugin (macOS bash 3.2)
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: brew install bats-core shellcheck

      # Without this the job runs and proves nothing, which is the failure mode
      # every check here is written to avoid.
      - name: Check that the system bash really is the old one
        run: |
          /bin/bash --version | head -1
          /bin/bash --version | head -1 | grep --quiet 'version 3\.2' || {
            echo "the system bash is no longer 3.2, so this job is not testing what it claims" >&2
            exit 1
          }

      # The lint itself has to run here too: it is the check that guards every
      # script in the repository, and it used to reach for a bash 4 builtin.
      - name: Lint the shell scripts on the system bash
        run: /bin/bash hack/shell-lint.sh

      - name: Run the plugin's suite against the system bash
        run: make plugin-test MACHINE_BASH=/bin/bash

  release:
    name: release
    runs-on: ubuntu-latest
    # A release is the plugin, so it waits for the job that holds the plugin's
    # own constraint as well as for the suites. Publishing an archive out of a
    # build that went red would put a broken plugin behind a checksum, which is
    # the one place a checksum cannot help.
    needs:
      - chart
      - plugin
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Refuses when the tag, the plugin and the chart do not say the same thing,
      # and computes the published checksum from the archive it just wrote rather
      # than from anywhere else.
      - name: Build the plugin's archive, its checksum and the krew manifest
        run: ./hack/release-archives.sh --version "${GITHUB_REF_NAME#v}"

      - name: Publish them on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The archive is named for the version the script derived, not for the
          # tag as it was typed: the trigger glob is `v*`, so a tag the script
          # normalises differently would otherwise fail at the upload.
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "dist/kubectl-machine_v${version}.tar.gz" \
            dist/SHA256SUMS \
            dist/machine.yaml

  image:
    name: image
    runs-on: ubuntu-latest
    # The same argument the release job makes, which was not applied here. On a
    # tag this publishes the shim, and it used to do so alongside the suites
    # rather than after them - so a red `make test` or `make conform` left an
    # image already pushed and immutable at that tag.
    #
    # It matters more than an ungated publish usually would. The chart pins this
    # image by digest, so the two are a matched pair, and this was the half with
    # no gate. The cost is that the image build now waits for the chart job on
    # every pull request; that is accepted rather than split into a fourth job,
    # because more publishing surface is worse than slower feedback.
    needs:
      - chart
      - plugin
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assert the image's archive guarantees
        run: make image-test

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Every push and pull request builds both architectures, so an
      # architecture-specific break is caught before a tag is cut. Only a tag
      # publishes.
      - name: Build the image for every supported architecture
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: images/shim
          file: images/shim/Containerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: false

      - name: Log in to the registry
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: images/shim
          file: images/shim/Containerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  integration:
    name: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, because one assertion installs the previous chart
      # revision and upgrades to this one. At the default depth of 1 the
      # revision to upgrade from does not resolve and that assertion skips
      # itself in silence.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      # The preset assertions build a preset into the cluster's own registry
      # rather than pulling a published one, so that what they prove is that a
      # name resolves and that what it resolves to boots. Without crane they
      # skip rather than fail, which would make them silent here.
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # A rendering test cannot tell whether the copy preserved a file
      # capability, or whether the second start really does nothing. Only a real
      # cluster can.
      - name: Seed a machine end to end
        env:
          TEMPLATE_URL: ${{ vars.INTEGRATION_TEMPLATE_URL }}
          TEMPLATE_SHA256: ${{ vars.INTEGRATION_TEMPLATE_SHA256 }}
        run: make integration-test
