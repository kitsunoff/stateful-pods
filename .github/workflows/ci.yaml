name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.19.1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stateful-pods-shim
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
  HELM_UNITTEST_VERSION: v1.0.3
  KUBECONFORM_VERSION: v0.7.0

jobs:
  chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version ${{ env.HELM_UNITTEST_VERSION }}

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --assume-yes shellcheck

      - name: Install kubeconform
        run: |
          curl --silent --show-error --location --fail \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar --extract --gzip --directory /usr/local/bin kubeconform

      - name: Lint the shell scripts
        run: make shell-lint

      - name: Lint the chart
        run: make lint

      - name: Check the documentation guarantees values.yaml makes
        run: make docs

      - name: Run the chart unit tests
        run: make test

      - name: Run the shell script tests
        run: make shell-test

      # The catalog is written by a bot, which is why it is checked - and the
      # check is what enforces that an entry is a digest rather than a tag. The
      # bump workflow runs it on its own commit, but that is the bot checking its
      # own work; a human-authored catalog edit reaches here and nowhere else.
      - name: Check the catalog against what the project builds
        run: make presets

      # Every refusal that makes a preset worth more than an `lxc` source with a
      # checksum somebody found: a signature that does not verify, one stripped
      # out, one never served, an archive that does not match, a signing key that
      # is not the pinned one. Tests nobody runs are not tests.
      - name: Run the preset tests
        run: make preset-test

      - name: Validate every example against the Kubernetes API schemas
        run: make conform

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assert the image's archive guarantees
        run: make image-test

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Every push and pull request builds both architectures, so an
      # architecture-specific break is caught before a tag is cut. Only a tag
      # publishes.
      - name: Build the image for every supported architecture
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: images/shim
          file: images/shim/Containerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: false

      - name: Log in to the registry
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: images/shim
          file: images/shim/Containerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  integration:
    name: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, because one assertion installs the previous chart
      # revision and upgrades to this one. At the default depth of 1 the
      # revision to upgrade from does not resolve and that assertion skips
      # itself in silence.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      # The preset assertions build a preset into the cluster's own registry
      # rather than pulling a published one, so that what they prove is that a
      # name resolves and that what it resolves to boots. Without crane they
      # skip rather than fail, which would make them silent here.
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # A rendering test cannot tell whether the copy preserved a file
      # capability, or whether the second start really does nothing. Only a real
      # cluster can.
      - name: Seed a machine end to end
        env:
          TEMPLATE_URL: ${{ vars.INTEGRATION_TEMPLATE_URL }}
          TEMPLATE_SHA256: ${{ vars.INTEGRATION_TEMPLATE_SHA256 }}
        run: make integration-test
