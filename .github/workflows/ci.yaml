name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.19.1
  HELM_UNITTEST_VERSION: v1.0.3
  KUBECONFORM_VERSION: v0.7.0

jobs:
  chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version ${{ env.HELM_UNITTEST_VERSION }}

      - name: Install kubeconform
        run: |
          curl --silent --show-error --location --fail \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar --extract --gzip --directory /usr/local/bin kubeconform

      - name: Lint the chart
        run: make lint

      - name: Check the documentation guarantees values.yaml makes
        run: make docs

      - name: Run the chart unit tests
        run: make test

      - name: Validate every example against the Kubernetes API schemas
        run: make conform
