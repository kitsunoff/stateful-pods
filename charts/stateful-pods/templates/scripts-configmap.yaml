{{- include "stateful-pods.validate" . -}}
{{- $root := . }}
{{- range $name, $machine := .Values.machines }}
{{- $ctx := dict "root" $root "name" $name "machine" $machine }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stateful-pods.machine.name" $ctx }}
  labels:
    {{- include "stateful-pods.machine.labels" $ctx | nindent 4 }}
# The scripts that fill and prepare this machine's root filesystem.
#
# They live in the chart rather than in the image for two reasons. The seeding
# step for an OCI source runs inside the machine's own source image, which this
# project does not build, so the script has to be mounted in. And keeping the rest
# here means a fix ships as a `helm upgrade` instead of an image release, so the
# chart and the logic it runs can never be different versions of each other.
#
# Values never appear in these scripts. Everything a script needs arrives through
# the environment, so nothing a user writes in values.yaml is ever parsed as shell.
data:
  {{- ($root.Files.Glob "scripts/*.sh").AsConfig | nindent 2 }}
{{- end }}
