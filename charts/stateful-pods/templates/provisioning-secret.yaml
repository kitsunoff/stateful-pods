{{- include "stateful-pods.validate" . -}}
{{- /* The provisioning material a machine supplied inline.

       Only the inline form lands here. Material named through `valueFrom` stays
       where it already is, which is the whole point of that form: it appears
       neither in the values file nor in this Secret nor in the Helm release.

       A Secret rather than a ConfigMap for everything, without asking whether a
       particular input is sensitive. The chart cannot tell - a `runcmd` may
       carry a token - and guessing wrong in that direction is the expensive
       mistake. It is stated in values.yaml that inline material is stored in
       the Helm release, because that is a property of Helm this chart cannot
       fix and is the reason the reference form exists.

       One Secret per machine rather than one per release: the material belongs
       to the machine, and a release that grows a second machine must not have
       to rename the first one's Secret. */ -}}
{{- $root := . }}
{{- range $name, $machine := .Values.machines }}
{{- $ctx := dict "root" $root "name" $name "machine" $machine }}
{{- $resolved := include "stateful-pods.machine.provisioning.resolved" $ctx | fromYaml }}
{{- if $resolved.inline }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stateful-pods.machine.provisioning.secretName" $ctx }}
  labels:
    {{- include "stateful-pods.machine.labels" $ctx | nindent 4 }}
type: Opaque
data:
  {{- range $path, $content := $resolved.inline }}
  {{ $path }}: {{ $content | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
