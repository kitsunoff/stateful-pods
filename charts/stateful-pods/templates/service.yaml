{{- include "stateful-pods.validate" . -}}
{{- $root := . }}
{{- range $name, $machine := .Values.machines }}
{{- $ctx := dict "root" $root "name" $name "machine" $machine }}
{{- $ports := include "stateful-pods.machine.ports" $ctx | fromYamlArray }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stateful-pods.machine.name" $ctx }}
  labels:
    {{- include "stateful-pods.machine.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  # A machine's stable name must keep resolving while its operating system is
  # still booting, and while it is unwell. A machine is a pet with an address, not
  # a member of a pool whose traffic is withheld until it is healthy.
  publishNotReadyAddresses: true
  selector:
    {{- include "stateful-pods.machine.selectorLabels" $ctx | nindent 4 }}
  {{- if $ports }}
  # One entry per declared port, which is what publishes an SRV record under the
  # port's own name - the way a client finds where a machine's service is without
  # the number being written down a second time.
  #
  # The target is the number rather than the port's name. A named target resolves
  # through the guest container's port list, so a machine whose service is
  # declared correctly and whose container list somehow was not would resolve to
  # nothing; there is no remapping here to justify the indirection.
  ports:
    {{- range $port := $ports }}
    - name: {{ $port.name | quote }}
      port: {{ $port.port }}
      targetPort: {{ $port.port }}
      protocol: {{ $port.protocol | quote }}
    {{- end }}
  {{- end }}
{{- end }}
