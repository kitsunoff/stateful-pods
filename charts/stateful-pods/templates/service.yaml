{{- include "stateful-pods.validate" . -}}
{{- $root := . }}
{{- range $name, $machine := .Values.machines }}
{{- $ctx := dict "root" $root "name" $name "machine" $machine }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stateful-pods.machine.name" $ctx }}
  labels:
    {{- include "stateful-pods.machine.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  # A machine's stable name must keep resolving while its operating system is
  # still booting, and while it is unwell. A machine is a pet with an address, not
  # a member of a pool whose traffic is withheld until it is healthy.
  publishNotReadyAddresses: true
  selector:
    {{- include "stateful-pods.machine.selectorLabels" $ctx | nindent 4 }}
{{- end }}
