{{- include "stateful-pods.validate" . -}}
{{- $root := . }}
{{- range $name, $machine := .Values.machines }}
{{- $ctx := dict "root" $root "name" $name "machine" $machine }}
{{- $objectName := include "stateful-pods.machine.name" $ctx }}
{{- $rootfs := $machine.rootfs | default dict }}
{{- $mode := $machine.security.mode }}
{{- /* A preset resolves here, once, and everything below sees the reference it
       names rather than the name. The seeding path is the oci path unchanged. */ -}}
{{- $source := include "stateful-pods.machine.resolvedSource" $ctx | fromYaml }}
{{- $snapshot := dig "dataSource" "volumeSnapshotName" "" $rootfs | default "" }}
{{- $pullSecret := "" }}
{{- if eq $source.kind "oci" }}
{{- $pullSecret = index $source "pullSecretName" | default "" }}
{{- end }}
{{- /* The provisioning material, resolved once. Everything below sees the file
       names the machine's inputs are materialized under and never the inputs. */ -}}
{{- $provisioning := include "stateful-pods.machine.provisioning.resolved" $ctx | fromYaml }}
{{- $hasMaterial := include "stateful-pods.machine.provisioning.hasMaterial" $ctx }}
{{- /* Whether that material is mounted into this pod at all. Under `cloud-init`
       it is: the step that writes the seed reads it before the machine starts.
       Under `exec` it is not - the script is carried to a booted machine by a
       Job beside this pod, and mounting it here would put it in a container
       that has nothing to do with it, inside a pod a user execs into. */ -}}
{{- $inPod := and (eq $provisioning.backend "cloud-init") $hasMaterial }}
{{- /* The ports the machine declares, normalised and in a stable order. */ -}}
{{- $ports := include "stateful-pods.machine.ports" $ctx | fromYamlArray }}
{{- /* What the machine may reach, and what happens to everything else. */ -}}
{{- $egress := include "stateful-pods.machine.egress" $ctx | fromYaml }}
{{- /* The volumes beside the root filesystem, ordered by mount path so that one
       declared inside another is mounted after it. */ -}}
{{- $volumes := include "stateful-pods.machine.volumes" $ctx | fromYamlArray }}
{{- $mounted := list }}
{{- range $volume := $volumes }}
{{- if not $volume.provisioned }}
{{- $mounted = append $mounted $volume }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $objectName }}
  labels:
    {{- include "stateful-pods.machine.labels" $ctx | nindent 4 }}
spec:
  # A machine is one instance. At one replica the StatefulSet controller
  # terminates the pod fully before creating its replacement, so an update never
  # runs two instances mounting the same root filesystem.
  replicas: 1
  serviceName: {{ $objectName }}
  selector:
    matchLabels:
      {{- include "stateful-pods.machine.selectorLabels" $ctx | nindent 6 }}
  # Retain is already the default. It is stated here anyway, because the rootfs is
  # everything that makes this machine a pet and its survival should not depend on
  # a default staying a default.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: {{ $objectName }}
        labels:
          {{- include "stateful-pods.machine.labels" $ctx | nindent 10 }}
      spec:
        # A root filesystem can only be mounted by one instance at a time.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $rootfs.size | default "8Gi" | quote }}
        {{- if not (kindIs "invalid" (index $rootfs "storageClassName")) }}
        # An explicit "" means "no class" and disables dynamic provisioning, which
        # is not the same as omitting the field; the difference is preserved.
        storageClassName: {{ index $rootfs "storageClassName" | quote }}
        {{- end }}
        {{- if $snapshot }}
        dataSource:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: {{ $snapshot }}
        {{- end }}
    {{- /* The volumes the machine declares beside its root filesystem, in the
           order they are mounted. The root filesystem stays first: the guest
           mounts every one of these inside its mount point, and a container's
           mounts are made in the order they appear.

           Named for the volume alone rather than for the machine. A volume name
           in a pod specification is a DNS-1123 label of at most 63 characters and
           the object name may already be 61, so `<release>-<machine>-<volume>`
           would leave two characters for the volume's own name. The claim the
           controller creates still carries the machine's, because it appends the
           pod's: `data-<release>-<machine>-0`.

           That name is as permanent as the root filesystem's. Renaming a volume
           orphans its claim and provisions a new empty one. */ -}}
    {{- range $volume := $volumes }}
    {{- if $volume.provisioned }}
    - metadata:
        name: {{ $volume.name | quote }}
        labels:
          {{- include "stateful-pods.machine.labels" $ctx | nindent 10 }}
      spec:
        # A machine is one instance, so every volume the chart provisions for it
        # is single-writer. A claim that has to be shared is one somebody else
        # made, named through existingClaim.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $volume.size | quote }}
        {{- if $volume.hasClass }}
        # An explicit "" means "no class" and disables dynamic provisioning,
        # which is not the same as omitting the field; the difference is
        # preserved here exactly as it is for the root filesystem.
        storageClassName: {{ $volume.storageClassName | quote }}
        {{- end }}
        {{- if $volume.snapshot }}
        dataSource:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: {{ $volume.snapshot }}
        {{- end }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      {{- if or $inPod $egress.declared }}
      annotations:
        {{- if $egress.declared }}
        # What replaces a machine when its egress policy changes. The policy is a
        # ConfigMap, and a ConfigMap whose content changes restarts nothing on
        # its own: the proxy would go on enforcing the policy it was started
        # with, while the values described something else. Unlike the
        # provisioning material this is entirely visible to Helm - there is no
        # reference form for a firewall rule - so the digest is exact.
        checksum/egress: {{ include "stateful-pods.machine.egress.checksum" $ctx | quote }}
        {{- end }}
        # What restarts a machine when its provisioning material changes. Helm
        # renders the inline material itself, so a change to it changes this
        # digest and the pod is replaced.
        #
        # It cannot see inside a Secret it does not own, so referenced material
        # that has rotated produces no restart of its own. The revision folded in
        # below is the pure-Helm way to ask for one; the other two answers - a
        # controller that watches referenced Secrets, or `kubectl rollout
        # restart` - are documented rather than built. Once a restart does
        # happen the change applies either way, because the instance identity is
        # recomputed from the files that were actually materialized. The gap is
        # in triggering the restart, not in applying the change.
        {{- if $inPod }}
        checksum/provisioning: {{ include "stateful-pods.machine.provisioning.checksum" $ctx | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "stateful-pods.machine.labels" $ctx | nindent 8 }}
    spec:
      {{- if eq $mode "userns" }}
      # The pod runs in its own user namespace, so the capability added below is
      # void on the host.
      hostUsers: false
      {{- end }}
      {{- with $machine.hostname }}
      hostname: {{ . }}
      {{- end }}
      # A machine is an operating system, not a workload that talks to the
      # cluster. It has never had a use for a ServiceAccount token, and after
      # the root change it could not reach one anyway - the path the kubelet
      # projects it to is in the shim's filesystem, on the other side of the
      # pivot. Declining it is the honest form of that, and it means the one
      # identity this chart does create, for the Job that runs a machine's
      # script, is the only one anywhere near a machine.
      automountServiceAccountToken: false
      {{- if or $pullSecret $inPod $mounted $egress.declared }}
      volumes:
        {{- if $egress.declared }}
        # The proxy's configuration, and the rules the packet filter enforces
        # itself. Mounted into the proxy and into the step that programs the
        # namespace, and into nothing the machine can reach.
        - name: egress
          configMap:
            name: {{ include "stateful-pods.machine.egress.configName" $ctx | quote }}
        {{- end }}
        {{- /* The claims the machine mounts but the chart did not create. Their
               size, class, access mode and lifetime belong to whoever made them,
               which is what makes this the way a machine reaches shared
               storage. */ -}}
        {{- range $volume := $mounted }}
        - name: {{ $volume.name | quote }}
          persistentVolumeClaim:
            claimName: {{ $volume.claim | quote }}
        {{- end }}
        {{- if $pullSecret }}
        # The credentials for this machine's source, projected to the file name
        # every Docker client looks for so that the registry client finds them
        # the ordinary way. Mounted into the seeding step and nowhere else: the
        # guest container is the one a user execs into.
        - name: source-credentials
          secret:
            secretName: {{ $pullSecret | quote }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- if $inPod }}
        # The machine's provisioning material, assembled into one directory of
        # fixed file names. This is where "inline or a reference" stops being two
        # things: the step that reads this directory cannot tell which form an
        # input arrived in, needs no API access and needs no ServiceAccount
        # token.
        #
        # Each input has exactly one source, so the chart can guarantee at render
        # time that no two of them map to the same file - a projected volume with
        # a path collision is rejected by the kubelet, which surfaces as a
        # machine that never starts a container.
        #
        # Mounted into the provisioning step and nowhere else. Mounted into the
        # guest it would be readable from inside the machine for its whole life,
        # through a path the machine never asked for.
        - name: provisioning
          projected:
            defaultMode: 0400
            sources:
              {{- if $provisioning.inline }}
              - secret:
                  name: {{ include "stateful-pods.machine.provisioning.secretName" $ctx | quote }}
                  items:
                    {{- range $path, $content := $provisioning.inline }}
                    - key: {{ $path | quote }}
                      path: {{ $path | quote }}
                    {{- end }}
              {{- end }}
              {{- range $ref := $provisioning.refs }}
              {{- if eq $ref.kind "secret" }}
              - secret:
                  name: {{ $ref.name | quote }}
                  items:
                    - key: {{ $ref.key | quote }}
                      path: {{ $ref.path | quote }}
              {{- else }}
              - configMap:
                  name: {{ $ref.name | quote }}
                  items:
                    - key: {{ $ref.key | quote }}
                      path: {{ $ref.path | quote }}
              {{- end }}
              {{- end }}
        {{- end }}
      {{- end }}
      # Every step below runs on every pod start, because Kubernetes has no
      # conditional init container. What makes seeding happen once is the record
      # they keep on the volume, not the pod spec.
      initContainers:
        # Fills the volume from the machine's source, the first time only.
        #
        # The chart's own image, for both source kinds. This step used to run the
        # machine's own source image for an oci source, because copying an
        # image's filesystem faithfully needed a tool from inside it; the step now
        # fetches and flattens the image from here instead, so nothing from the
        # source is ever executed and no source has to carry an archiver.
        - name: seed
          image: {{ $root.Values.shim.image | quote }}
          command:
            {{- if eq $source.kind "oci" }}
            - /usr/local/lib/stateful-pods/seed-oci.sh
            {{- else }}
            - /usr/local/lib/stateful-pods/seed-lxc.sh
            {{- end }}
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
            {{- if $pullSecret }}
            # Not part of the shared seed environment: only this step fetches
            # anything, and the credentials go no further than it does.
            - name: DOCKER_CONFIG
              value: /etc/stateful-pods/registry-auth
            # The name alone, so that a rejected credential can say which Secret
            # was used without the message carrying anything from inside it.
            - name: SP_SOURCE_PULL_SECRET
              value: {{ $pullSecret | quote }}
            {{- end }}
          securityContext:
            {{- include "stateful-pods.machine.initSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
            {{- if $pullSecret }}
            - name: source-credentials
              mountPath: /etc/stateful-pods/registry-auth
              readOnly: true
            {{- end }}
        # Records what the volume holds and makes sure the machine's identity is
        # its own.
        - name: prepare
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/prepare.sh
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
          securityContext:
            {{- include "stateful-pods.machine.initSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
        # Writes the files the chart maintains inside the machine. It runs here,
        # before the root change, because this is where the pod's own copies of
        # them are still reachable - after the change they are on the other side
        # of it, which is the whole reason the machine needs its own.
        - name: customize
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/customize.sh
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
          securityContext:
            {{- include "stateful-pods.machine.initSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
        # Provisions the machine: the users, keys, packages and commands its
        # values ask for, written into the machine's own root filesystem.
        #
        # A step of its own rather than the tail of the one above, for two
        # reasons. The step above writes the three files the chart maintains and
        # has no use for a Secret's contents, so giving it the material would put
        # it in a container that does not need it. And a failure here should be
        # legible as a failure to provision: an image that cannot run the backend
        # its machine named fails the pod, and this is the container whose logs
        # say so.
        #
        # Rendered under both backends. A pod whose shape changed with the
        # backend would make a backend switch a replacement by a different kind
        # of pod, and under `exec` the step's one line of output is what says
        # the chart deliberately did nothing.
        #
        # Last, because the drop-in it writes is about files the step above has
        # already placed, and because there is nothing to inspect until the
        # volume holds an operating system.
        - name: provision
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/provision.sh
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
            {{- include "stateful-pods.machine.provisioning.env" $ctx | nindent 12 }}
          securityContext:
            {{- include "stateful-pods.machine.initSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
            {{- if $inPod }}
            - name: provisioning
              mountPath: /provisioning
              readOnly: true
            {{- end }}
        {{- if $egress.declared }}
        # The proxy that decides this machine's outbound TCP.
        #
        # A sidecar - an init container with restartPolicy: Always - which is
        # what makes Kubernetes start it here, wait for it, and leave it running
        # for the life of the pod. It has to be in this pod because it has to be
        # in this network namespace: a redirect is a rule in that namespace, and
        # a proxy anywhere else is one the redirect could not reach.
        #
        # The first container this chart runs from an image it did not build.
        - name: envoy
          image: {{ $root.Values.envoy.image | quote }}
          restartPolicy: Always
          args:
            - --config-path
            - /etc/stateful-pods/egress/envoy.yaml
            # Its own output is where every decision this policy makes is
            # written, allowed and refused alike.
            - --log-level
            - warning
            # Envoy buffers its access log and flushes it every ten seconds by
            # default. That is right for a proxy carrying a datacentre's traffic
            # and wrong for this one: the log is the only answer to "why can
            # this machine not reach X", and an answer that arrives ten seconds
            # after the question is one people stop waiting for. The volume here
            # is a machine's own connections, so a second costs nothing.
            - --file-flush-interval-msec
            - "1000"
          securityContext:
            # The user the redirect exempts, by exactly this number. A process
            # inside the machine running as it would be exempted too, which
            # values.yaml says out loud - and which is why a policy worth
            # relying on has a layer-4 half, enforced where a process's own
            # identity is not what decides.
            runAsUser: {{ include "stateful-pods.egress.proxyUser" $ctx }}
            runAsGroup: {{ include "stateful-pods.egress.proxyUser" $ctx }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: egress
              mountPath: /etc/stateful-pods/egress
              readOnly: true
        # Programs the pod's network namespace, and exits.
        #
        # After the four steps above, because seeding fetches a root filesystem
        # from a registry and a policy applied before it would need a rule for
        # the chart's own source. After the proxy, because traffic redirected to
        # a port nothing is listening on is traffic refused - this step waits for
        # the proxy to answer before it redirects anything to it. Before the
        # guest, because a machine whose first connections escaped the policy
        # would be a policy that depends on timing.
        #
        # It is the one container here granted NET_ADMIN, and it is gone by the
        # time the machine starts. The machine is not granted it and cannot undo
        # any of this from inside itself.
        - name: egress
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/egress-setup.sh
          env:
            - name: SP_MACHINE
              value: {{ $name | quote }}
            - name: SP_EGRESS_DEFAULT
              value: {{ $egress.default | quote }}
            - name: SP_EGRESS_DIR
              value: /etc/stateful-pods/egress
            - name: SP_EGRESS_PROXY_PORT
              value: {{ include "stateful-pods.egress.proxyPort" $ctx | quote }}
            - name: SP_EGRESS_ADMIN_PORT
              value: {{ include "stateful-pods.egress.adminPort" $ctx | quote }}
            - name: SP_EGRESS_PROXY_USER
              value: {{ include "stateful-pods.egress.proxyUser" $ctx | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: egress
              mountPath: /etc/stateful-pods/egress
              readOnly: true
        {{- end }}
      # Proxmox's own TimeoutStopSec. An operating system needs longer to stop
      # than an application does, and being killed at the end of it is an unclean
      # shutdown of a pet on every ordinary delete.
      terminationGracePeriodSeconds: 120
      containers:
        - name: guest
          # The shim, not the machine's operating system: that lives in the volume
          # mounted below, seeded from the machine's source. This container's
          # process mounts what the machine's init expects, changes the root to
          # the volume, and then *becomes* the machine.
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/boot.sh
          {{- if $ports }}
          # The ports this machine declares it serves. A declaration and not a
          # gate: the pod's network namespace is reachable on every port
          # something inside it listens on, whatever this list says. What it
          # buys is that `kubectl describe pod` and everything built on it can
          # see a machine's services, and that the Service beside this one can
          # publish an SRV record per name. The input that does restrict
          # anything is machines.<name>.network.ingress.
          ports:
            {{- range $port := $ports }}
            - name: {{ $port.name | quote }}
              containerPort: {{ $port.port }}
              protocol: {{ $port.protocol | quote }}
            {{- end }}
          {{- end }}
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
          # A terminal is what gives the machine a /dev/console to bind, which is
          # where an init system writes its boot sequence. Without it `kubectl
          # logs` is empty, and empty logs are the first thing anyone checks when
          # a machine does not come up.
          tty: true
          # Readiness only: it gates the Service endpoint without touching the
          # machine. A liveness probe would reboot a pet because something inside
          # it was briefly unresponsive, destroying the state that would have
          # explained why.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - /.stateful-pods/bin/ready.sh
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - /.stateful-pods/bin/stop.sh
          securityContext:
            # Declared, not omitted. A kubelet running with --seccomp-default=true
            # gives every container that names no profile the runtime's default
            # one, and that profile does not permit pivot_root - the call this
            # container makes to become the machine. A machine that inherited it
            # would render, seed its volume over several minutes and then die at
            # the root change, on some clusters and not others. Naming the filter
            # here is what makes the posture a property of these values rather
            # than of a flag on the node.
            {{- include "stateful-pods.machine.guestSeccompProfile" $ctx | nindent 12 }}
            # Declared for the same reason, against the same kind of default. A
            # container the runtime has not been told to stop policing is one
            # containerd confines with its own default AppArmor profile, on every
            # node where AppArmor is supported - and that profile denies mount
            # outright, which is what this container does before it can become the
            # machine. Whether a node happens to have apparmor_parser installed is
            # not something a machine's posture should turn on. This is not a
            # profile the chart ships; it is the field a real one would be named
            # in.
            appArmorProfile:
              type: Unconfined
            {{- if eq $mode "privileged" }}
            # The privilege this mode grants, enumerated so that a reviewer can
            # read it. ALL is dropped first, so this list is the whole of it and
            # not an addition to whatever a runtime currently calls a default.
            #
            # It is what a container gets by default plus SYS_ADMIN, which is what
            # the shim needs for mount(2) and pivot_root(2) - the same capability
            # the other mode grants, and the reason both modes exist. A systemd
            # guest and a busybox guest were both booted on this set, from both
            # source kinds, and nothing had to be added.
            #
            # What is absent is as deliberate as what is present. MAC_ADMIN,
            # MAC_OVERRIDE, SYS_TIME, SYS_MODULE and SYS_RAWIO are the five the
            # reference implementation has always refused a privileged container.
            # DAC_READ_SEARCH and SYS_BOOT are absent permanently: they are what
            # open_by_handle_at and kexec_load need, and those are the two escape
            # primitives the profile in profiles/ exists to close.
            #
            # A capability added here later should name the machine that needed it
            # and the failure that showed it. Without that the set drifts back
            # towards the blanket flag one well-intentioned commit at a time.
            #
            # allowPrivilegeEscalation is deliberately left unset, exactly as it
            # is in the other mode - and not because the API would refuse it.
            # Setting it false is accepted, and the container keeps SYS_ADMIN;
            # what it does is set no_new_privs, and no_new_privs makes the kernel
            # ignore setuid bits and file capabilities on every exec that
            # follows. Inside a whole operating system that is su, sudo, ping and
            # everything else the distribution ships - including the file
            # capability the seeding step goes out of its way to preserve. It
            # would not cost the container its privilege; it would cost the
            # machine its own userland.
            capabilities:
              drop:
                - ALL
              add:
                - AUDIT_WRITE
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - KILL
                - MKNOD
                - NET_BIND_SERVICE
                - NET_RAW
                - SETFCAP
                - SETGID
                - SETPCAP
                - SETUID
                - SYS_ADMIN
                - SYS_CHROOT
            {{- else }}
            # SYS_ADMIN is what the shim needs for mount(2) and pivot_root(2).
            # allowPrivilegeEscalation is left unset for the reason given above.
            capabilities:
              add:
                - SYS_ADMIN
            {{- end }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
            {{- /* Inside the root filesystem's own mount point, so that when
                   pivot_root makes it the machine's root the volume is already at
                   the path the values named and the boot script does not have to
                   know it exists. Mounted into this container and no other: the
                   preparation steps fill and configure a root filesystem, and the
                   one that seeds is entitled to wipe the directory it works in. */ -}}
            {{- range $volume := $volumes }}
            - name: {{ $volume.name | quote }}
              mountPath: {{ printf "/mnt/rootfs%s" $volume.mountPath | quote }}
              {{- if $volume.readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
{{- end }}
