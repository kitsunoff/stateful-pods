{{- include "stateful-pods.validate" . -}}
{{- $root := . }}
{{- range $name, $machine := .Values.machines }}
{{- $ctx := dict "root" $root "name" $name "machine" $machine }}
{{- $objectName := include "stateful-pods.machine.name" $ctx }}
{{- $rootfs := $machine.rootfs | default dict }}
{{- $mode := $machine.security.mode }}
{{- $source := $machine.source }}
{{- $snapshot := dig "dataSource" "volumeSnapshotName" "" $rootfs | default "" }}
{{- $pullSecret := "" }}
{{- if eq $source.kind "oci" }}
{{- $pullSecret = index $source "pullSecretName" | default "" }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $objectName }}
  labels:
    {{- include "stateful-pods.machine.labels" $ctx | nindent 4 }}
spec:
  # A machine is one instance. At one replica the StatefulSet controller
  # terminates the pod fully before creating its replacement, so an update never
  # runs two instances mounting the same root filesystem.
  replicas: 1
  serviceName: {{ $objectName }}
  selector:
    matchLabels:
      {{- include "stateful-pods.machine.selectorLabels" $ctx | nindent 6 }}
  # Retain is already the default. It is stated here anyway, because the rootfs is
  # everything that makes this machine a pet and its survival should not depend on
  # a default staying a default.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: {{ $objectName }}
        labels:
          {{- include "stateful-pods.machine.labels" $ctx | nindent 10 }}
      spec:
        # A root filesystem can only be mounted by one instance at a time.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $rootfs.size | default "8Gi" | quote }}
        {{- if not (kindIs "invalid" (index $rootfs "storageClassName")) }}
        # An explicit "" means "no class" and disables dynamic provisioning, which
        # is not the same as omitting the field; the difference is preserved.
        storageClassName: {{ index $rootfs "storageClassName" | quote }}
        {{- end }}
        {{- if $snapshot }}
        dataSource:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: {{ $snapshot }}
        {{- end }}
  template:
    metadata:
      labels:
        {{- include "stateful-pods.machine.labels" $ctx | nindent 8 }}
    spec:
      {{- if eq $mode "userns" }}
      # The pod runs in its own user namespace, so the capability added below is
      # void on the host.
      hostUsers: false
      {{- end }}
      {{- with $machine.hostname }}
      hostname: {{ . }}
      {{- end }}
      {{- if $pullSecret }}
      volumes:
        # The credentials for this machine's source, projected to the file name
        # every Docker client looks for so that the registry client finds them
        # the ordinary way. Mounted into the seeding step and nowhere else: the
        # guest container is the one a user execs into.
        - name: source-credentials
          secret:
            secretName: {{ $pullSecret | quote }}
            items:
              - key: .dockerconfigjson
                path: config.json
      {{- end }}
      # Every step below runs on every pod start, because Kubernetes has no
      # conditional init container. What makes seeding happen once is the record
      # they keep on the volume, not the pod spec.
      initContainers:
        # Fills the volume from the machine's source, the first time only.
        #
        # The chart's own image, for both source kinds. This step used to run the
        # machine's own source image for an oci source, because copying an
        # image's filesystem faithfully needed a tool from inside it; the step now
        # fetches and flattens the image from here instead, so nothing from the
        # source is ever executed and no source has to carry an archiver.
        - name: seed
          image: {{ $root.Values.shim.image | quote }}
          command:
            {{- if eq $source.kind "oci" }}
            - /usr/local/lib/stateful-pods/seed-oci.sh
            {{- else }}
            - /usr/local/lib/stateful-pods/seed-lxc.sh
            {{- end }}
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
            {{- if $pullSecret }}
            # Not part of the shared seed environment: only this step fetches
            # anything, and the credentials go no further than it does.
            - name: DOCKER_CONFIG
              value: /etc/stateful-pods/registry-auth
            # The name alone, so that a rejected credential can say which Secret
            # was used without the message carrying anything from inside it.
            - name: SP_SOURCE_PULL_SECRET
              value: {{ $pullSecret | quote }}
            {{- end }}
          securityContext:
            {{- include "stateful-pods.machine.initSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
            {{- if $pullSecret }}
            - name: source-credentials
              mountPath: /etc/stateful-pods/registry-auth
              readOnly: true
            {{- end }}
        # Records what the volume holds and makes sure the machine's identity is
        # its own.
        - name: prepare
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/prepare.sh
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
          securityContext:
            {{- include "stateful-pods.machine.initSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
        # Writes the files the chart maintains inside the machine. It runs here,
        # before the root change, because this is where the pod's own copies of
        # them are still reachable - after the change they are on the other side
        # of it, which is the whole reason the machine needs its own.
        - name: customize
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/customize.sh
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
          securityContext:
            {{- include "stateful-pods.machine.initSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
      # Proxmox's own TimeoutStopSec. An operating system needs longer to stop
      # than an application does, and being killed at the end of it is an unclean
      # shutdown of a pet on every ordinary delete.
      terminationGracePeriodSeconds: 120
      containers:
        - name: guest
          # The shim, not the machine's operating system: that lives in the volume
          # mounted below, seeded from the machine's source. This container's
          # process mounts what the machine's init expects, changes the root to
          # the volume, and then *becomes* the machine.
          image: {{ $root.Values.shim.image | quote }}
          command:
            - /usr/local/lib/stateful-pods/boot.sh
          env:
            {{- include "stateful-pods.machine.seedEnv" $ctx | nindent 12 }}
          # A terminal is what gives the machine a /dev/console to bind, which is
          # where an init system writes its boot sequence. Without it `kubectl
          # logs` is empty, and empty logs are the first thing anyone checks when
          # a machine does not come up.
          tty: true
          # Readiness only: it gates the Service endpoint without touching the
          # machine. A liveness probe would reboot a pet because something inside
          # it was briefly unresponsive, destroying the state that would have
          # explained why.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - /.stateful-pods/bin/ready.sh
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - /.stateful-pods/bin/stop.sh
          securityContext:
            # Declared, not omitted. A kubelet running with --seccomp-default=true
            # gives every container that names no profile the runtime's default
            # one, and that profile does not permit pivot_root - the call this
            # container makes to become the machine. A machine that inherited it
            # would render, seed its volume over several minutes and then die at
            # the root change, on some clusters and not others. Naming the filter
            # here is what makes the posture a property of these values rather
            # than of a flag on the node.
            {{- include "stateful-pods.machine.guestSeccompProfile" $ctx | nindent 12 }}
            # Declared for the same reason, against the same kind of default. A
            # container the runtime has not been told to stop policing is one
            # containerd confines with its own default AppArmor profile, on every
            # node where AppArmor is supported - and that profile denies mount
            # outright, which is what this container does before it can become the
            # machine. Whether a node happens to have apparmor_parser installed is
            # not something a machine's posture should turn on. This is not a
            # profile the chart ships; it is the field a real one would be named
            # in.
            appArmorProfile:
              type: Unconfined
            {{- if eq $mode "privileged" }}
            # The privilege this mode grants, enumerated so that a reviewer can
            # read it. ALL is dropped first, so this list is the whole of it and
            # not an addition to whatever a runtime currently calls a default.
            #
            # It is what a container gets by default plus SYS_ADMIN, which is what
            # the shim needs for mount(2) and pivot_root(2) - the same capability
            # the other mode grants, and the reason both modes exist. A systemd
            # guest and a busybox guest were both booted on this set, from both
            # source kinds, and nothing had to be added.
            #
            # What is absent is as deliberate as what is present. MAC_ADMIN,
            # MAC_OVERRIDE, SYS_TIME, SYS_MODULE and SYS_RAWIO are the five the
            # reference implementation has always refused a privileged container.
            # DAC_READ_SEARCH and SYS_BOOT are absent permanently: they are what
            # open_by_handle_at and kexec_load need, and those are the two escape
            # primitives the profile in profiles/ exists to close.
            #
            # A capability added here later should name the machine that needed it
            # and the failure that showed it. Without that the set drifts back
            # towards the blanket flag one well-intentioned commit at a time.
            #
            # allowPrivilegeEscalation is deliberately left unset, exactly as it
            # is in the other mode - and not because the API would refuse it.
            # Setting it false is accepted, and the container keeps SYS_ADMIN;
            # what it does is set no_new_privs, and no_new_privs makes the kernel
            # ignore setuid bits and file capabilities on every exec that
            # follows. Inside a whole operating system that is su, sudo, ping and
            # everything else the distribution ships - including the file
            # capability the seeding step goes out of its way to preserve. It
            # would not cost the container its privilege; it would cost the
            # machine its own userland.
            capabilities:
              drop:
                - ALL
              add:
                - AUDIT_WRITE
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - KILL
                - MKNOD
                - NET_BIND_SERVICE
                - NET_RAW
                - SETFCAP
                - SETGID
                - SETPCAP
                - SETUID
                - SYS_ADMIN
                - SYS_CHROOT
            {{- else }}
            # SYS_ADMIN is what the shim needs for mount(2) and pivot_root(2).
            # allowPrivilegeEscalation is left unset for the reason given above.
            capabilities:
              add:
                - SYS_ADMIN
            {{- end }}
          volumeMounts:
            - name: {{ $objectName }}
              mountPath: /mnt/rootfs
{{- end }}
