# The presets this chart ships, and what each one resolves to.
#
# A machine that declares
#
#   source:
#     kind: preset
#     name: debian-trixie
#
# is rendered with the reference below. The resolution happens while the chart
# renders and at no later point, so the manifest a user reviews carries the same
# source the pod that runs will use.
#
# Every entry is pinned by digest and never by tag. A machine is a pet whose disk
# has to be reproducible, and a reference that came to mean different content
# later would make a machine's origin change under it without anything in its
# values changing, and do it invisibly. `hack/check-presets.sh` enforces that,
# and enforces that these names are the ones images/presets/presets.list builds.
#
# There is such a reference, and this file deliberately does not name it. Each
# release also publishes a rolling tag - ghcr.io/kitsunoff/stateful-pods-ubuntu
# under `noble`, and so on - that follows the newest build, for somebody who
# wants to pull one without first looking up which build exists. It is a name for
# a person. What a machine is seeded from is a digest, which is what makes
# publishing a moving tag cost nothing here.
#
# This file is maintained by the daily bump workflow, which publishes a newer
# upstream build and then proposes the corresponding line here for review. What
# the chart points at is a decision, even when the newer content is almost
# certainly better, so the publishing is automatic and this file is not.
#
# It lives here rather than in values.yaml because it is data rather than
# configuration: a user does not set it, and `.Files` reaches it inside a
# packaged chart, so a preset resolves whether the chart was installed from a
# checkout or from a package.
#
# Each reference was built by hack/preset-build.sh from the upstream root
# filesystem named in its own OCI labels, after the upstream's detached signature
# over its published checksums verified against the key pinned at
# images/presets/signing-key.asc.
