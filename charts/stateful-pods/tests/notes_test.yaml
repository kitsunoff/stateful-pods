suite: rendering - NOTES.txt
templates:
  - NOTES.txt
release:
  name: lab
  namespace: homelab
capabilities:
  majorVersion: 1
  minorVersion: 33
set:
  machines.web:
    source:
      kind: oci
      reference: docker.io/library/debian:13
    rootfs:
      size: 8Gi
    security:
      mode: userns
tests:
  - it: names the machine and its object name
    asserts:
      - matchRegexRaw:
          pattern: 'lab-web'
      - matchRegexRaw:
          pattern: 'web'

  # The one place the derived names are shown to the person who chose them, and
  # the only moment the consequence of choosing them is concrete. It cannot be
  # acted on for this machine - it is already installed - but renaming one later
  # is a live possibility, and this is where the volume's name becomes visible.
  - it: says the names it just derived are permanent
    asserts:
      - matchRegexRaw:
          pattern: 'permanent'
      - matchRegexRaw:
          pattern: 'orphans'

  - it: gives the machine's in-cluster DNS name
    asserts:
      - matchRegexRaw:
          pattern: 'lab-web-0\.lab-web\.homelab\.svc\.cluster\.local'

  - it: says the root filesystem is seeded from the machine's source
    asserts:
      - matchRegexRaw:
          pattern: 'filled from its oci source'
      - matchRegexRaw:
          pattern: 'once'

  - it: no longer says the machine does not boot
    asserts:
      - notMatchRegexRaw:
          pattern: 'does not boot'
      - notMatchRegexRaw:
          pattern: 'placeholder'

  - it: says the machine boots and how to watch it
    asserts:
      - matchRegexRaw:
          pattern: 'The machine then boots'
      - matchRegexRaw:
          pattern: 'logs lab-web-0 --follow'

  - it: says how to reach the machine and how it stops
    asserts:
      - matchRegexRaw:
          pattern: 'exec --stdin --tty lab-web-0'
      - matchRegexRaw:
          pattern: 'reports itself ready'
      - matchRegexRaw:
          pattern: 'shut\s+down and waits up to 120 seconds'

  - it: says how a machine keeps one of the managed files as its own
    asserts:
      - matchRegexRaw:
          pattern: '/etc/resolv.conf'
      - matchRegexRaw:
          pattern: 'stateful-pods-ignore\.resolv\.conf'

  - it: points at the plugin for the machine's own name, and keeps the raw form
    asserts:
      - matchRegexRaw:
          pattern: 'kubectl machine shell web --namespace homelab'
      - matchRegexRaw:
          pattern: 'kubectl machine console web --namespace homelab --follow'
      - matchRegexRaw:
          pattern: 'kubectl machine status web --namespace homelab'
      # Both forms, because the plugin is optional and the notes are read by
      # people who do not have it.
      - matchRegexRaw:
          pattern: 'logs lab-web-0 --follow'
      - matchRegexRaw:
          pattern: 'exec --stdin --tty lab-web-0'

  - it: does not offer the plugin as a way to remove the root filesystem
    asserts:
      - matchRegexRaw:
          pattern: 'delete pvc lab-web-lab-web-0'
      - notMatchRegexRaw:
          pattern: 'machine delete web.*pvc'

  - it: names the backend the machine is provisioned by
    asserts:
      - matchRegexRaw:
          pattern: 'provisioned by cloud-init'

  - it: warns a cloud-init machine that its image has to be able to run it
    asserts:
      - matchRegexRaw:
          pattern: 'guest\.provisioning: native'

  - it: says nothing about provisioning inputs when none were supplied
    asserts:
      - notMatchRegexRaw:
          pattern: 'shadow'

  - it: names the native backend when that is what the machine chose
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        security:
          mode: userns
        guest:
          provisioning: native
    asserts:
      - matchRegexRaw:
          pattern: 'provisioned natively'
      # None of the cloud-init advice belongs on a machine that did not choose it.
      - notMatchRegexRaw:
          pattern: 'NoCloud seed'
      - notMatchRegexRaw:
          pattern: 'cloud-init\.disabled'

  # Silently ignoring half a values file is a bad surprise, and this is the one
  # place a user sees it before the machine has already been made.
  - it: says which structured inputs a raw file shadowed
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        security:
          mode: userns
        cloudInit:
          userData:
            value: "#cloud-config\n"
          user:
            value: maxim
          password:
            value: "$6$abc$def"
    asserts:
      - matchRegexRaw:
          pattern: 'userData'
      - matchRegexRaw:
          pattern: 'shadow'
      - matchRegexRaw:
          pattern: 'user'
      - matchRegexRaw:
          pattern: 'password'

  - it: warns about shadowing even when the raw file is a reference
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        security:
          mode: userns
        cloudInit:
          userData:
            valueFrom:
              secretKeyRef:
                name: machine-secrets
                key: user-data
          user:
            value: maxim
    asserts:
      - matchRegexRaw:
          pattern: 'shadow'

  - it: does not warn when a raw file shadowed nothing
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        security:
          mode: userns
        cloudInit:
          userData:
            value: "#cloud-config\n"
    asserts:
      - notMatchRegexRaw:
          pattern: 'shadow'

  - it: tells a machine with referenced material how to apply a rotation
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        security:
          mode: userns
        cloudInit:
          password:
            valueFrom:
              secretKeyRef:
                name: machine-secrets
                key: root-password-hash
    asserts:
      - matchRegexRaw:
          pattern: 'provisioningRevision'
