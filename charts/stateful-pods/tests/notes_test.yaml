suite: rendering - NOTES.txt
templates:
  - NOTES.txt
release:
  name: lab
  namespace: homelab
capabilities:
  majorVersion: 1
  minorVersion: 33
set:
  machines.web:
    source:
      kind: oci
      reference: docker.io/library/debian:13
    rootfs:
      size: 8Gi
    security:
      mode: userns
tests:
  - it: names the machine and its object name
    asserts:
      - matchRegexRaw:
          pattern: 'lab-web'
      - matchRegexRaw:
          pattern: 'web'

  - it: gives the machine's in-cluster DNS name
    asserts:
      - matchRegexRaw:
          pattern: 'lab-web-0\.lab-web\.homelab\.svc\.cluster\.local'

  - it: says the root filesystem is seeded from the machine's source
    asserts:
      - matchRegexRaw:
          pattern: 'filled from its oci source'
      - matchRegexRaw:
          pattern: 'once'

  - it: no longer says the machine does not boot
    asserts:
      - notMatchRegexRaw:
          pattern: 'does not boot'
      - notMatchRegexRaw:
          pattern: 'placeholder'

  - it: says the machine boots and how to watch it
    asserts:
      - matchRegexRaw:
          pattern: 'The machine then boots'
      - matchRegexRaw:
          pattern: 'logs lab-web-0 --follow'

  - it: says how to reach the machine and how it stops
    asserts:
      - matchRegexRaw:
          pattern: 'exec --stdin --tty lab-web-0'
      - matchRegexRaw:
          pattern: 'reports itself ready'
      - matchRegexRaw:
          pattern: 'shut\s+down and waits up to 120 seconds'

  - it: says how a machine keeps one of the managed files as its own
    asserts:
      - matchRegexRaw:
          pattern: '/etc/resolv.conf'
      - matchRegexRaw:
          pattern: 'stateful-pods-ignore\.resolv\.conf'
