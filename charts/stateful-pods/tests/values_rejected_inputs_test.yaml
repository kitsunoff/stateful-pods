suite: values validation - deliberately rejected inputs
templates:
  - statefulset.yaml
release:
  name: lab
capabilities:
  majorVersion: 1
  minorVersion: 33
tests:
  - it: rejects a per-machine init system selector and says what replaces it
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        guest:
          init: systemd
    asserts:
      - failedTemplate:
          errorPattern: '(?s)machines\.web\.guest\.init: not supported.*detects the guest''s init system at boot'

  - it: rejects a bare per-machine init selector
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        init: systemd
    asserts:
      - failedTemplate:
          errorPattern: '(?s)machines\.web\.init: not supported.*detects the guest''s init system at boot'

  - it: rejects a per-machine replica count and says what replaces it
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        replicas: 2
    asserts:
      - failedTemplate:
          errorPattern: '(?s)machines\.web\.replicas: not supported.*single instance.*machines'

  - it: rejects a release-level replica count
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
      replicaCount: 3
    asserts:
      - failedTemplate:
          errorPattern: '(?s)replicaCount: not supported.*single instance'
