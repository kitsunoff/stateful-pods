suite: naming - the StatefulSet selector never changes
templates:
  - statefulset.yaml
release:
  name: lab
capabilities:
  majorVersion: 1
  minorVersion: 33
tests:
  - it: renders the identity-only selector at chart 0.1.0 with the default shim image
    chart:
      version: 0.1.0
      appVersion: "0.1.0"
    set:
      shim.image: ghcr.io/kitsunoff/stateful-pods-shim:placeholder
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: stateful-pods
            app.kubernetes.io/instance: lab
            stateful-pods.io/machine: web

  - it: renders the byte-identical selector at chart 9.9.9 with a different shim image
    chart:
      version: 9.9.9
      appVersion: "7.7.7"
    set:
      shim.image: ghcr.io/kitsunoff/stateful-pods-shim:v2
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: stateful-pods
            app.kubernetes.io/instance: lab
            stateful-pods.io/machine: web

  - it: keeps every version-bearing label out of the selector
    chart:
      version: 9.9.9
      appVersion: "7.7.7"
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
    asserts:
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/version"]
      - notExists:
          path: spec.selector.matchLabels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: keeps the pod template labels a superset of the selector
    chart:
      version: 9.9.9
      appVersion: "7.7.7"
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: stateful-pods
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: lab
      - equal:
          path: spec.template.metadata.labels["stateful-pods.io/machine"]
          value: web
