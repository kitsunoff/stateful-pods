# The provisioning Secret refuses the same values the StatefulSet does.
#
# A suite of its own, and not a case added to the entry-point suite, because Helm
# attributes a `fail` to whichever template it was rendering when the failure was
# raised. A suite listing two templates can therefore assert the refusal for one
# of them and be told "no failed document" for the other, which says nothing
# about whether the second template validates at all.
#
# What it guards is real: a Secret that rendered while the StatefulSet refused
# would leave a machine's provisioning material in the namespace with no machine
# to read it.
suite: values validation - the provisioning Secret has the same entry point
templates:
  - provisioning-secret.yaml
release:
  name: lab
capabilities:
  majorVersion: 1
  minorVersion: 33
tests:
  - it: refuses a machine with no security mode, even though it has material
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        cloudInit:
          user:
            value: maxim
    asserts:
      - failedTemplate:
          errorPattern: 'machines\.web\.security\.mode: not set'

  - it: refuses a provisioning input that is malformed
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        security:
          mode: userns
        cloudInit:
          user:
            value: maxim
            valueFrom:
              secretKeyRef:
                name: s
                key: k
    asserts:
      - failedTemplate:
          errorPattern: 'machines\.web\.cloudInit\.user: carries both'

  - it: renders the Secret when the values are accepted
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        security:
          mode: userns
        cloudInit:
          user:
            value: maxim
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
