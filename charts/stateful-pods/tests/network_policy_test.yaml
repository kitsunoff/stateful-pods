suite: rendering - the ingress posture
templates:
  - network-policy.yaml
release:
  name: lab
capabilities:
  majorVersion: 1
  minorVersion: 33
tests:
  - it: renders nothing for a machine that declares ports and asks for nothing
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        network:
          ports:
            ssh:
              port: 22
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing for the posture the default names
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        network:
          ingress: any
          ports:
            ssh:
              port: 22
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one policy named for the machine, selecting the machine's own pod
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        network:
          ingress: declared
          ports:
            ssh:
              port: 22
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: lab-web
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: stateful-pods
            app.kubernetes.io/instance: lab
            stateful-pods.io/machine: web

  - it: governs inbound traffic only, so the machine keeps its resolver
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        network:
          ingress: declared
          ports:
            ssh:
              port: 22
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - notExists:
          path: spec.egress

  - it: admits every declared port and names no peer
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        network:
          ingress: declared
          ports:
            dns-tcp:
              port: 53
              protocol: TCP
            dns-udp:
              port: 53
              protocol: UDP
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: 53
                  protocol: TCP
                - port: 53
                  protocol: UDP

  - it: admits nothing when the posture is asked for with no ports declared
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
        network:
          ingress: declared
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ingress
          value: []

  - it: validates through the same entry point every other template does
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        network:
          ingress: declared
    asserts:
      - failedTemplate:
          errorPattern: 'machines\.web\.security\.mode: not set'
