suite: rendering - the StatefulSet
templates:
  - statefulset.yaml
release:
  name: lab
capabilities:
  majorVersion: 1
  minorVersion: 33
set:
  machines.web:
    source:
      kind: oci
      reference: docker.io/library/debian:13
    rootfs:
      size: 8Gi
    security:
      mode: userns
tests:
  - it: is a StatefulSet with exactly one replica
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.replicas
          value: 1

  - it: selects its pod on the machine's identity labels
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: stateful-pods
            app.kubernetes.io/instance: lab
            stateful-pods.io/machine: web

  # The chart's version is pinned here rather than read from Chart.yaml, the
  # same way the selector suite pins it. What is asserted is that the two labels
  # are rendered from the chart's own version and appVersion at all - so reading
  # the live ones would make the assertion compare a value with itself, and would
  # additionally turn every release into a test edit.
  - it: carries the object labels on its own metadata
    chart:
      version: 9.9.9
      appVersion: "8.8.8"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: stateful-pods-9.9.9
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "8.8.8"

  - it: runs the configured shim image on the guest container
    set:
      shim.image: ghcr.io/kitsunoff/stateful-pods-shim:v1.2.3
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: guest
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kitsunoff/stateful-pods-shim:v1.2.3

  - it: never runs two instances of a machine at once
    asserts:
      # A StatefulSet at one replica terminates the pod fully before creating its
      # replacement. A Deployment-style rollout, which can overlap the two, would
      # let both mount the same root filesystem.
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.replicas
          value: 1
      - notExists:
          path: spec.strategy
      - notExists:
          path: spec.podManagementPolicy
