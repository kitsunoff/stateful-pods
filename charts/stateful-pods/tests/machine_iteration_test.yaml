suite: naming - the templates iterate the machines map
templates:
  - statefulset.yaml
release:
  name: lab
capabilities:
  majorVersion: 1
  minorVersion: 33
tests:
  - it: fails two valid machines on the count guard, not on a naming collision
    set:
      machines.web:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
      machines.db:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: lab-db
        documentIndex: 0
      - equal:
          path: metadata.name
          value: lab-web
        documentIndex: 1

  - it: renders a machine whose name is not the first key alphabetically
    set:
      machines.zulu:
        source:
          kind: oci
          reference: docker.io/library/debian:13
        rootfs:
          size: 8Gi
        security:
          mode: userns
    asserts:
      - equal:
          path: metadata.name
          value: lab-zulu
      - equal:
          path: spec.selector.matchLabels["stateful-pods.io/machine"]
          value: zulu
